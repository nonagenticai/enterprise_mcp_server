name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies (resolve graph)
        run: uv sync --no-install-project --frozen || uv sync --no-install-project
      - name: Import smoke (bumped dependency)
        run: uv run --no-sync python -c "import fastmcp; print('fastmcp', getattr(fastmcp, '__version__', '?'))"

  # WHY THIS JOB EXISTS. Until now `CI` had exactly one job, `smoke`, which ran
  # `uv sync --no-install-project` and `python -c "import fastmcp"`. That cannot fail for a
  # defect in this repository's own code: it never installs the project and never executes a
  # single assertion. Reverting any real fix left CI green. Meanwhile `tests/test_http_utils.py`
  # (added in #89, precisely because "a repo with no tests cannot verify a dependency upgrade")
  # has never been run by CI at all.
  #
  # This job runs that suite, and only that suite.
  tests:
    runs-on: ubuntu-latest
    # WHY A DATABASE SERVICE. `src/auth.py`, `src/audit.py` and `src/api.py` were never
    # migrated from asyncpg to psycopg v3 and called `pool.acquire()`, `conn.fetch()`,
    # `conn.fetchval()`, `conn.fetchrow()` and `$1` placeholders -- none of which exist on
    # psycopg -- so those paths raised AttributeError at runtime. Nothing caught it for
    # months: `compile` only parses, `smoke` never installs the project, and no test had
    # ever opened a connection. `tests/test_db_integration.py` closes that, but it needs a
    # REAL PostgreSQL: a mocked pool would be written against whichever driver API the
    # author believed in, and would have agreed with the bug.
    #
    # This is a SERVICE on the existing job, deliberately NOT a fourth job: downstream
    # automation gates on the number of checks this workflow reports, so adding a job
    # would break it silently. Keep this workflow at three checks.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: ems_verify
        ports:
          - 5432:5432
        # Without a health check the suite races the server's first-boot initdb.
        options: >-
          --health-cmd "pg_isready -U verify -d ems_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://verify:verify@localhost:5432/ems_verify
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      # `--no-install-project` is deliberately absent: the suite imports `src.http_utils`.
      #
      # `--locked`, NOT `--frozen`, and no `|| uv sync` fallback. Measured on this branch:
      # set `sse-starlette==3.4.99` (a version that does not exist) in pyproject.toml without
      # regenerating uv.lock and `uv sync --frozen` exits 0 and installs 3.4.8 -- the OLD pin.
      # The suite then passes while a dependency-upgrade PR claims the bump was verified, which
      # is the same vacuity this job exists to remove, merely relocated from the assertion step
      # to the install step. `uv sync --locked` exits 1 on that mismatch. Verified green with
      # `--locked` on main and on all three open bot branches before this was changed.
      #
      # `smoke` above keeps `--frozen || uv sync` deliberately: it resolves the graph WITHOUT the
      # project and is allowed to tolerate drift, because it asserts nothing either way.
      - name: Install dependencies (with project, lockfile enforced)
        run: uv sync --locked
      # `python -m pytest`, not bare `pytest`, so the repo root is on sys.path either way.
      # `-p no:cacheprovider` keeps a stale .pytest_cache out of a fresh runner's tree.
      - name: Run test suite
        run: uv run --no-sync python -m pytest -p no:cacheprovider
      # WHY THIS EXISTS. README.md calls uv.lock "the authoritative -- and only -- dependency
      # set" and the image installs it with `uv sync --frozen`, yet NO job in this workflow has
      # ever asked whether anything in that set has a published CVE. SECURITY.md:64 scopes out
      # only dependencies "not yet fixed upstream" and promises "we'll pick up patched releases
      # promptly" -- a promise nothing measures. Filed against gitops-production#4050.
      #
      # ⛔ WHY A STEP AND NOT A FOURTH JOB -- DO NOT "TIDY" THIS INTO A JOB. The header of this
      # job already says downstream automation gates on the number of checks this workflow
      # reports. That consumer is now IDENTIFIED, not assumed: `AA_MERGE_REPO_ALLOWLIST` in the
      # n8n ConfigMap carries `nonagenticai/enterprise_mcp_server:3`, parsed by
      # `approval-callback.json :: Check Merge Base` into `expectedChecks` and handed to
      # coding-github's `merge_pull_request`, which grades
      #     `elif expected_checks is not None and total < expected_checks: verdict = "pending"`.
      # It is a FLOOR (>= 3), so a fourth check would not block a merge -- but it would silently
      # stop the floor being TIGHT: the intent recorded beside that value is "every check ems has
      # must have completed and passed", and at :3 with 4 checks a PR could clear the floor with
      # the fourth not yet created. The opposite direction is worse and has already happened:
      # `:4` was set for a `probe-oracles` job that was then deleted in #147, `total < expected`
      # became unsatisfiable, and the merge path refused every PR until it was corrected to :3.
      # A step keeps the count at 3, so neither failure mode is reachable and no cross-repo
      # ConfigMap change has to land in lockstep with this one.
      #
      # WHAT IT ASSERTS: every pinned runtime distribution in uv.lock, resolved exactly as the
      # lock resolves it, is free of known vulnerabilities. `--locked` (not `--frozen`) for the
      # same reason the install step above uses it -- a lock that disagrees with pyproject.toml
      # must not be auditable, or the audit describes a resolution nobody committed.
      # `--no-dev` scopes this to the set that actually ships; a ruff CVE is not a product
      # exposure. It fails loudly if the export comes back EMPTY, exactly like `compile` below:
      # an audit that reads zero packages cannot report a vulnerable one.
      #
      # `uvx`, NOT `uv pip install pip-audit` into the project venv. Installing the tool into the
      # environment it is about to scan adds pip-audit's own dependency tree to the audited set,
      # so a CVE in the SCANNER could red this repo for something it does not ship. uvx keeps the
      # tool in its own environment and `-r` audits the lock and nothing else.
      #
      # The retry is for osv.dev / pypi.org flaking (ConnectionResetError, SSL handshake), not
      # for CVEs: a real finding exits 1 on all three attempts and the step stays red. ⛔ The
      # loop must not be written as `...; fi` then `rc=$?` -- that reads the `fi`, is always 0,
      # and swallowed the real exit code fleet-wide for weeks in 2026-05.
      - name: Audit uv.lock for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          REQ="$RUNNER_TEMP/requirements.audit.txt"
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$REQ"
          n="$(grep -c '^[A-Za-z0-9]' "$REQ" || true)"
          if [ "${n:-0}" -eq 0 ]; then
            echo "FAIL: uv export produced 0 pinned distributions -- this audit is blind, not clean"
            exit 1
          fi
          echo "Auditing $n pinned distributions from uv.lock"
          rc=0
          for attempt in 1 2 3; do
            rc=0
            # `|| rc=$?` and NOT an `if`: under `set -e` this captures the REAL exit code of
            # pip-audit itself. See the warning above about `rc=$?` placed after a `fi`.
            uvx pip-audit --requirement "$REQ" --disable-pip || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pip-audit attempt $attempt exited $rc -- retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          exit "$rc"

  # WHY THIS JOB EXISTS. A tracked `.py` was once pushed with a trailing `}], ` -- a plain
  # SyntaxError -- and BOTH existing checks went green. Neither could see it: `smoke` never
  # installs the project, and `tests` collects only `testpaths = ["tests"]` (pyproject.toml),
  # so nothing outside `tests/` is ever parsed. This job is the only thing that reads the rest.
  #
  # WHAT THIS ASSERTS: every file `git ls-files '*.py'` reports is syntactically valid
  # Python under the interpreter this repo pins (3.14). Tracked-only and pattern-scoped, so a
  # file whose name does not end in `.py` (an editor backup such as `foo.py.bak`) and untracked
  # scratch files stay out of scope, and `compileall` cannot silently widen it. It fails loudly if the file list comes back
  # EMPTY -- a gate that counts no sites cannot fail one.
  #
  # WHAT IT DOES *NOT* ASSERT: nothing about behaviour, imports, types, style or security.
  # It is a parse gate, not a lint gate: there is no ruff/mypy config in this repo and this
  # job does not add one. A file that parses can still raise ImportError on first import,
  # and this job will not notice. It also installs NO dependencies and does not run pytest --
  # deliberately, so it cannot be laundered by a resolver, a lockfile or a collection miss.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain setup-python, not setup-uv: this job must not depend on the dependency graph.
      # Pinned to 3.14 because syntax acceptance is interpreter-version-dependent and
      # `requires-python = ">=3.14"` -- the floor is what has to parse.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Parse every tracked Python file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.py' > tracked-py.z
          python - tracked-py.z <<'PY'
          import ast, pathlib, sys

          listing = pathlib.Path(sys.argv[1]).read_bytes()
          files = [p for p in listing.split(b"\0") if p]
          if not files:
              print("FAIL: `git ls-files '*.py'` matched 0 files -- this gate is blind, not clean")
              sys.exit(1)

          bad = 0
          for raw in files:
              name = raw.decode("utf-8", "surrogateescape")
              try:
                  ast.parse(pathlib.Path(name).read_bytes(), filename=name)
              except SyntaxError as exc:
                  bad += 1
                  print(f"FAIL {name}:{exc.lineno}:{exc.offset}: {exc.msg}")
              except (ValueError, OSError) as exc:
                  bad += 1
                  print(f"FAIL {name}: {type(exc).__name__}: {exc}")

          if bad:
              print(f"\n{bad} of {len(files)} tracked Python file(s) do not parse")
              sys.exit(1)
          print(f"PASS: all {len(files)} tracked Python file(s) parse under Python {sys.version.split()[0]}")
          PY

      # WHY THESE TWO STEPS ARE HERE AND NOT ANYWHERE ELSE. Both are stdlib-only AST
      # walkers over `src/`: no install, no dependency graph, nothing but the interpreter
      # this job already pins -- which is precisely this job's charter ("the only thing
      # that reads the rest" of the tree).
      #
      # They are deliberately NOT pytest tests, so `testpaths` cannot reach them:
      # `checks/__init__.py` says so, they define no `test_*` function and their filenames
      # match neither `test_*.py` nor `*_test.py`. Measured: `pytest checks/ --collect-only`
      # exits 5 with 0 items. Adding `checks` to `testpaths` would LOOK like wiring and gate
      # nothing at all. A fourth job is also ruled out -- see "Keep this workflow at three
      # checks" on the `tests` job above -- so they run as ordinary steps of this one.
      #
      # Each is a BARE single command. No `|| true`, no `|| echo`, no pipe, no `if`
      # condition: `main()` returns the verdict as an exit code and that exit code must be
      # the step's, or the gate prints its own failure into a green check.
      - name: Oracle -- every audit log_event call passes every required argument
        run: python3 -m checks.audit_call_arity
      - name: Oracle -- every HTTP_* constant resolves to an imported status module
        run: python3 -m checks.http_status_binding
